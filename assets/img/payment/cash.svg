<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Bill background -->
  <rect x="4" y="13" width="40" height="22" rx="3" fill="#2d6a4f"/>
  <rect x="6" y="15" width="36" height="18" rx="2" fill="#40916c"/>

  <!-- Corner decorations -->
  <rect x="7" y="16" width="6" height="4" rx="1" fill="#2d6a4f" opacity="0.7"/>
  <rect x="35" y="16" width="6" height="4" rx="1" fill="#2d6a4f" opacity="0.7"/>
  <rect x="7" y="28" width="6" height="4" rx="1" fill="#2d6a4f" opacity="0.7"/>
  <rect x="35" y="28" width="6" height="4" rx="1" fill="#2d6a4f" opacity="0.7"/>

  <!-- Center oval -->
  <ellipse cx="24" cy="24" rx="8" ry="8" fill="#2d6a4f"/>
  <ellipse cx="24" cy="24" rx="6" ry="6" fill="#40916c"/>

  <!-- Dollar sign -->
  <text x="24" y="28"
        font-family="Georgia,'Times New Roman',serif"
        font-size="12" fill="#d8f3dc" text-anchor="middle"
        font-weight="bold">$</text>
</svg>
