  <text x="960" y="514"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="14" fill="#c1935b" text-anchor="middle"
        opacity="0.65" letter-spacing="8">CHOCOLATE MADE EXPERIENCE</text>

  <!-- Placeholder notice (subtle) -->
  <text x="960" y="568"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="11" fill="#c1935b" text-anchor="middle"
