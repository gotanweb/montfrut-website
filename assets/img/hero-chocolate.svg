<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2840"/>
      <stop offset="55%" stop-color="#0d1e32"/>
      <stop offset="100%" stop-color="#07111e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="38%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#c1935b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c1935b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="72%" cy="45%" r="38%">
      <stop offset="0%" stop-color="#c1935b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c1935b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#fceac6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#fceac6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <rect width="1920" height="1080" fill="url(#glowC)"/>

  <!-- Large bokeh blobs -->
