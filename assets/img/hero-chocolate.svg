  <circle cx="960"  cy="130" r="80"  fill="#fceac6" opacity="0.04"/>
  <circle cx="1260" cy="870" r="100" fill="#c1935b" opacity="0.04"/>
  <circle cx="380"  cy="800" r="85"  fill="#fceac6" opacity="0.03"/>
  <circle cx="1750" cy="700" r="70"  fill="#c1935b" opacity="0.04"/>

  <!-- Small bokeh dots -->
  <circle cx="580"  cy="195" r="4" fill="#c1935b" opacity="0.35"/>
  <circle cx="740"  cy="340" r="3" fill="#fceac6" opacity="0.22"/>
  <circle cx="1320" cy="175" r="5" fill="#c1935b" opacity="0.28"/>
  <circle cx="1510" cy="610" r="4" fill="#fceac6" opacity="0.18"/>
  <circle cx="360"  cy="510" r="3" fill="#c1935b" opacity="0.22"/>
  <circle cx="1720" cy="240" r="6" fill="#fceac6" opacity="0.14"/>
  <circle cx="195"  cy="855" r="4" fill="#c1935b" opacity="0.22"/>
  <circle cx="1110" cy="960" r="5" fill="#fceac6" opacity="0.16"/>
  <circle cx="820"  cy="920" r="3" fill="#c1935b" opacity="0.2"/>
  <circle cx="1440" cy="940" r="4" fill="#fceac6" opacity="0.14"/>
  <circle cx="100"  cy="430" r="5" fill="#c1935b" opacity="0.16"/>
  <circle cx="1860" cy="500" r="4" fill="#fceac6" opacity="0.12"/>

  <!-- Horizontal ornament rule with heart -->
  <line x1="790" y1="528" x2="890" y2="528" stroke="#c1935b" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="960" cy="528" r="3.5" fill="#f25850" opacity="0.7"/>
  <line x1="1030" y1="528" x2="1130" y2="528" stroke="#c1935b" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Brand name -->
  <text x="960" y="488"
        font-family="Georgia,'Times New Roman',serif"
