<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fceac6"/>
      <stop offset="60%" stop-color="#feeed5"/>
      <stop offset="100%" stop-color="#f5e2c0"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c1935b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c1935b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c1935b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c1935b" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#warm)"/>

  <!-- Decorative corner marks -->
  <path d="M60,60 L60,100 M60,60 L100,60" stroke="#c1935b" stroke-opacity="0.45" stroke-width="2" fill="none"/>
  <path d="M740,60 L740,100 M740,60 L700,60" stroke="#c1935b" stroke-opacity="0.45" stroke-width="2" fill="none"/>
  <path d="M60,940 L60,900 M60,940 L100,940" stroke="#c1935b" stroke-opacity="0.45" stroke-width="2" fill="none"/>
  <path d="M740,940 L740,900 M740,940 L700,940" stroke="#c1935b" stroke-opacity="0.45" stroke-width="2" fill="none"/>

  <!-- Portrait oval frame -->
  <ellipse cx="400" cy="400" rx="220" ry="270" fill="none" stroke="#c1935b" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="8 5"/>

  <!-- Silhouette — abstract artisan figure (simplified) -->
  <!-- Head -->
  <ellipse cx="400" cy="240" rx="60" ry="72" fill="#c1935b" opacity="0.18"/>
  <!-- Shoulders / torso -->
  <path d="M310,340 Q330,310 400,310 Q470,310 490,340 L510,520 Q480,540 400,545 Q320,540 290,520 Z"
        fill="#c1935b" opacity="0.14"/>
  <!-- Arms / hands working -->
  <path d="M290,420 Q250,440 235,480 Q240,510 270,500 Q285,470 310,460"
        fill="#c1935b" opacity="0.18"/>
  <path d="M510,420 Q550,440 565,480 Q560,510 530,500 Q515,470 490,460"
        fill="#c1935b" opacity="0.18"/>
  <!-- Chocolate bowl suggestion -->
  <ellipse cx="400" cy="510" rx="80" ry="28" fill="#c1935b" opacity="0.22"/>
  <path d="M320,510 Q320,550 400,560 Q480,550 480,510" fill="#c1935b" opacity="0.16" stroke="none"/>

  <!-- Ornament rule -->
  <line x1="340" y1="640" x2="376" y2="640" stroke="#c1935b" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="400" cy="640" r="3" fill="#f25850" opacity="0.65"/>
  <line x1="424" y1="640" x2="460" y2="640" stroke="#c1935b" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Label -->
  <text x="400" y="676"
        font-family="Georgia,'Times New Roman',serif"
        font-size="22" fill="#253245" text-anchor="middle"
        opacity="0.65" letter-spacing="4">OUR STORY</text>

  <text x="400" y="704"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="11" fill="#c1935b" text-anchor="middle"
        opacity="0.45" letter-spacing="3">REPLACE WITH ARTISAN PORTRAIT</text>
</svg>
