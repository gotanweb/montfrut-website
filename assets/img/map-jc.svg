<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 338" width="600" height="338">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2840"/>
      <stop offset="100%" stop-color="#0d1e32"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="338" fill="url(#bg)"/>

  <!-- Water (Hudson River suggestion — right side) -->
  <rect x="420" y="0" width="180" height="338" fill="#152235" opacity="0.8"/>
  <path d="M420,0 L440,338 L420,338 Z" fill="#1a2840"/>

  <!-- City grid — horizontal streets -->
  <line x1="30" y1="80"  x2="420" y2="80"  stroke="#253245" stroke-width="6" opacity="0.9"/>
  <line x1="30" y1="120" x2="420" y2="120" stroke="#1e3050" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="160" x2="420" y2="160" stroke="#253245" stroke-width="4" opacity="0.8"/>
  <line x1="30" y1="200" x2="420" y2="200" stroke="#1e3050" stroke-width="2" opacity="0.7"/>
  <line x1="30" y1="240" x2="420" y2="240" stroke="#253245" stroke-width="4" opacity="0.8"/>
  <line x1="30" y1="280" x2="420" y2="280" stroke="#1e3050" stroke-width="2" opacity="0.7"/>

  <!-- City grid — vertical streets -->
  <line x1="80"  y1="30" x2="80"  y2="310" stroke="#1e3050" stroke-width="2" opacity="0.7"/>
  <line x1="140" y1="30" x2="140" y2="310" stroke="#253245" stroke-width="4" opacity="0.8"/>
  <line x1="200" y1="30" x2="200" y2="310" stroke="#1e3050" stroke-width="2" opacity="0.7"/>
  <line x1="260" y1="30" x2="260" y2="310" stroke="#253245" stroke-width="4" opacity="0.8"/>
  <line x1="320" y1="30" x2="320" y2="310" stroke="#1e3050" stroke-width="2" opacity="0.7"/>
  <line x1="380" y1="30" x2="380" y2="310" stroke="#1e3050" stroke-width="2" opacity="0.6"/>

  <!-- Waterfront path -->
  <path d="M410,40 Q418,90 415,160 Q412,230 410,300" stroke="#c1935b" stroke-opacity="0.3" stroke-width="2" fill="none" stroke-dasharray="6 4"/>

  <!-- Location pin -->
  <!-- Pin shadow -->
  <ellipse cx="215" cy="188" rx="10" ry="4" fill="#000" opacity="0.3"/>
  <!-- Pin body -->
  <path d="M215,128 C196,128 180,144 180,163 C180,192 215,220 215,220 C215,220 250,192 250,163 C250,144 234,128 215,128 Z"
        fill="#c1935b"/>
  <!-- Pin inner circle -->
  <circle cx="215" cy="163" r="12" fill="#0d1e32"/>
  <circle cx="215" cy="163" r="5" fill="#c1935b"/>

  <!-- Pulsing ring around pin (static) -->
  <circle cx="215" cy="163" r="22" fill="none" stroke="#c1935b" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="215" cy="163" r="32" fill="none" stroke="#c1935b" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Labels -->
  <text x="215" y="250"
        font-family="Georgia,'Times New Roman',serif"
        font-size="15" fill="#fceac6" text-anchor="middle"
        font-weight="bold" opacity="0.9" letter-spacing="2">JERSEY CITY, NJ</text>

  <text x="215" y="270"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="9.5" fill="#c1935b" text-anchor="middle"
        opacity="0.7" letter-spacing="2.5">SERVING NY &amp; NJ</text>

  <!-- Water label -->
  <text x="500" y="175"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="9" fill="#c1935b" text-anchor="middle"
        opacity="0.45" letter-spacing="1.5">HUDSON</text>
  <text x="500" y="188"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="9" fill="#c1935b" text-anchor="middle"
        opacity="0.45" letter-spacing="1.5">RIVER</text>
</svg>
